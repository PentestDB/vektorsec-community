# ============================================================================
#  VektorSec — Nginx reverse proxy (ตัวอย่างสำหรับ production deploy)
# ----------------------------------------------------------------------------
#  ใช้คู่กับ docker-compose.yml ซึ่ง frontend ผูกไว้ที่ 127.0.0.1:3001
#  (backend 8081 / mongo 27017 / redis 6379 ผูก 127.0.0.1 เหมือนกัน
#   -> ไม่ต้องเปิดออกอินเทอร์เน็ตเด็ดขาด)
#
#  ขั้นตอนติดตั้ง (บน VPS / Ubuntu + Docker):
#    1) เปิด firewall:   sudo ufw allow 80/tcp && sudo ufw allow 443/tcp
#    2) วาง config นี้ที่:
#         sudo cp deploy/nginx.example.conf /etc/nginx/sites-available/vektorsec
#         sudo nano /etc/nginx/sites-available/vektorsec   # แก้ <YOUR_DOMAIN>
#         sudo ln -s /etc/nginx/sites-available/vektorsec /etc/nginx/sites-enabled/
#         sudo nginx -t && sudo systemctl reload nginx
#    3) ออก SSL อัตโนมัติด้วย certbot (เลือกตัวเลือก redirect):
#         sudo apt-get install -y certbot python3-certbot-nginx
#         sudo certbot --nginx -d <YOUR_DOMAIN>
#
#  ทางเลือกง่ายกว่า: ใช้ Caddy (ดู deploy/Caddyfile.example) ที่ออก Let's Encrypt
#  ให้อัตโนมัติ ไม่ต้องแตะ nginx เลย
# ============================================================================

# ── HTTP: redirect ไป HTTPS (certbot ใช้ path นี้ตอน renew) ──
server {
    listen 80;
    listen [::]:80;
    server_name <YOUR_DOMAIN>;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ──
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name <YOUR_DOMAIN>;

    # certbot --nginx จะเติม 2 บรรทัดล่างให้อัตโนมัติ (หลังรันครั้งแรก)
    # ssl_certificate     /etc/letsencrypt/live/<YOUR_DOMAIN>/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/<YOUR_DOMAIN>/privkey.pem;

    client_max_body_size 50m;

    # ส่งทุกอย่าง (หน้าเว็บ + /api + WebSocket/Socket.IO + noVNC)
    # ไปที่ gateway ของ frontend (frontend/server.js เป็นคน forward ต่อ
    # ไป backend 8081 / websockify 6080 อีกที — ดู frontend/.env)
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # รองรับ WebSocket (terminal / สตรีม agent / noVNC)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# ── ความปลอดภัย ─────────────────────────────────────────────
# ห้าม proxy/เปิด port: 8081 (backend), 27017 (MongoDB), 6379 (Redis)
# ถ้าใช้ Kali ในตัว ให้ 4242/4200/5901/9020 เป็น internal เท่านั้น