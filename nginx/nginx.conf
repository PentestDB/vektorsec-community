
# Connection request limit
limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;
limit_req_zone $binary_remote_addr zone=mylimit:30m rate=50r/s;

# Cache
proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=STATIC:10m inactive=1d use_temp_path=off;

client_body_timeout 15;
client_header_timeout 15;
send_timeout 10;

upstream nextjs_upstream {
    # server nextjs:3000;
    server 127.0.0.1:3000;

    # We could add additional servers here for load-balancing
}


upstream backend_upstream {
    # server backend:8080;
    server 127.0.0.1:8080;

    # We could add additional servers here for load-balancing
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
    proxy_buffering on;

    gzip on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_types text/css application/javascript image/svg+xml;


    client_max_body_size 30M;
    client_body_buffer_size 30M;


    limit_req zone=mylimit burst=30 nodelay;
    limit_conn conn_limit_per_ip 30;

    limit_req_status 429;


    set $block 0;

    # Allow only the *.bugbase.in, bugbase.in, and bugbase.ai hosts.
    if ($host ~* '^(.*\.)?(bugbase\.in|bugbase\.ai)$') {
        set $block 0;
    }


    # Allow all the ELB health check agents.
    if ($http_user_agent ~* '^ELB-HealthChecker\/.*$') {
        set $block 0;
    }

    if ($http_user_agent ~* '^Edge Health Probe$') {
        set $block 0;
    }

    if ($http_user_agent ~* '^kube-probe') {
        set $block 0;
    }


    if ($block = 1) {
        return 444;
    }

    location /healthcheck {
        access_log off;
        return 200 'A-OK!';
        add_header Content-Type text/plain;
    }


    location /_next/static {
        proxy_cache STATIC;
        proxy_pass http://nextjs_upstream;

    }

    location ~* ^/.*\\.(?:jpg|jpeg|gif|png|ico|cur|gz|svg|ttf)$ {
        proxy_cache STATIC;
        proxy_ignore_headers Cache-Control;
        proxy_cache_valid 60m;
        proxy_pass http://nextjs_upstream;

    }
    
    location /socket.io/ {
        if ($http_user_agent ~* (^w3af.sourceforge.net|dirbuster|gobuster|nikto|SF|sqlmap|fimap|nessus|whatweb|Openvas|jbrofuzz|libwhisker|webshag) ) {
            return 403;
        }

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;

        proxy_pass http://backend_upstream;
        
        proxy_ssl_session_reuse off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /static {
        proxy_cache STATIC;
        proxy_ignore_headers Cache-Control;
        proxy_cache_valid 60m;
        proxy_pass http://nextjs_upstream;

    }

    location / {

        if ($http_user_agent ~* (^w3af.sourceforge.net|dirbuster|gobuster|nikto|SF|sqlmap|fimap|nessus|whatweb|Openvas|jbrofuzz|libwhisker|webshag) ) {
            return 403;
        }

        proxy_pass http://nextjs_upstream;
    }

    location /api {

        if ($http_user_agent ~* (^w3af.sourceforge.net|dirbuster|gobuster|nikto|SF|sqlmap|fimap|nessus|whatweb|Openvas|jbrofuzz|libwhisker|webshag) ) {
            return 403;
        }

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-NginX-Proxy true;
        proxy_pass http://backend_upstream;
        proxy_ssl_session_reuse off;
        proxy_set_header Host $http_host;
        proxy_cache_bypass $http_upgrade;
        proxy_redirect off;
    }
}