name: vektorsec

services:
  mongodb:
    image: mongo:latest
    # Production: MongoDB runs with --auth. Set MONGO_USER / MONGO_PASSWORD
    # when deploying (see deploy/secrets.env). On a fresh volume the env vars
    # create the root user; on an existing volume the user must exist already.
    command: ["mongod", "--auth"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongodb-data:/data/db
    ports:
      - "127.0.0.1:27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "-u", "${MONGO_USER:-root}", "-p", "${MONGO_PASSWORD}", "--authenticationDatabase", "admin", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: always

  redis:
    image: redis:latest
    # Production: Redis requires a password (REDIS_PASSWORD, see deploy/secrets.env).
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: always

  backend:
    image: vektorsec-backend
    build: ./backend
    environment:
      MONGO_URI: mongodb://${MONGO_USER:-root}:${MONGO_PASSWORD}@mongodb:27017/vektorsec?authSource=admin
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      CODEX_HOME: /root/.codex
      SSH_CONFIG_FILE: /root/.ssh/config
      # "Local" work hosts execute in the backend runtime. Keep their folders
      # on the persistent backend-data volume across rebuilds/restarts.
      WORKSPACE_DIR: /srv/data/workspaces
    cap_add:
      # Required only when a workspace selects Local and starts OpenVPN there.
      - NET_ADMIN
    ports:
      - "127.0.0.1:8081:8081"
      - "127.0.0.1:6080:6080"
      - "127.0.0.1:9020:9020"
    volumes:
      - ./kali-data:/kali-data
      - /var/run/docker.sock:/var/run/docker.sock
      - backend-data:/srv/data
      - ./backend/.env:/srv/data/.env
      - ./config.toml:/srv/data/config.toml:ro
      - ${CODEX_AUTH_FILE:-${HOME}/.codex/auth.json}:/root/.codex/auth.json
      - ${HOST_SSH_DIR:-${HOME}/.ssh}:/root/.ssh:ro
      - ${HOST_SSH_KEYS_DIR:-${HOME}/keys}:/root/keys:ro
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    healthcheck:
      # Readiness endpoint (Mongo + Redis). Node 22 ships global fetch, so the
      # image needs no extra tooling for this probe.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8081/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  frontend:
    image: vektorsec-frontend
    build:
      context: ./frontend
    environment:
      PORT: 3001
      # Black-box gateway targets (server-side only — never reach the browser)
      BACKEND_URI: http://backend:8081
      VNC_ORIGIN_URI: http://backend:6080
    ports:
      - "127.0.0.1:3001:3001"
    env_file:
      - ./frontend/.env
    depends_on:
      - backend
    restart: unless-stopped

  # uncomment this incase you wish to use KALI box, uncomment volume as well
  # kali:
  #   build: ./kali
  #   container_name: kali
  #   privileged: true
  #   ports:
  #     - "4242:22"
  #     - "4200:4200"
  #     - "1194:1194/udp"
  #     - "9020:9020"
  #     - "5901:5901"
  #   volumes:
  #     - ./kali-data:/kali-data
  #   restart: unless-stopped

volumes:
  mongodb-data:
    driver: local
  redis-data:
    driver: local
  backend-data:
    driver: local
  # kali-data:
  #   driver: local
