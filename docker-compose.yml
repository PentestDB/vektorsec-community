services:
  mongodb:
    image: mongo:latest
    volumes:
      - mongodb-data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: always

  redis:
    image: redis:latest
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: always

  backend:
    build: ./backend
    environment:
      MONGO_URI: mongodb://mongodb:27017/pentestcopilot
      REDIS_URL: redis://redis:6379
      CODEX_HOME: /root/.codex
    ports:
      - "8080:8080"
      - "6080:6080"
    volumes:
      - ./kali-data:/kali-data
      - /var/run/docker.sock:/var/run/docker.sock
      - backend-data:/srv/data
      - ./backend/.env:/srv/data/.env
      - ./config.toml:/srv/data/config.toml:ro
      - ${CODEX_AUTH_FILE:-${HOME}/.codex/auth.json}:/root/.codex/auth.json
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env
    depends_on:
      - backend
    restart: unless-stopped

  # uncomment this incase you wish to use KALI box, uncomment volume as well
  # kali:
  #   build: ./kali
  #   container_name: kali
  #   privileged: true
  #   ports:
  #     - "4242:22"
  #     - "4200:4200"
  #     - "1194:1194/udp"
  #     - "9020:9020"
  #     - "5901:5901"
  #   volumes:
  #     - ./kali-data:/kali-data
  #   restart: unless-stopped

volumes:
  mongodb-data:
    driver: local
  redis-data:
    driver: local
  backend-data:
    driver: local
  # kali-data:
  #   driver: local
