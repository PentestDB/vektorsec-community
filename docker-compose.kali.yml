services:
  mongodb:
    image: mongo:latest
    volumes:
      - mongodb-data:/data/db
    ports:
      - "27017:27017"
    restart: always

  redis:
    image: redis:latest
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    restart: always

  backend:
    build: ./backend
    ports:
      - "8080:8080"
      - "6080:6080"
    volumes:
      - ./kali-data:/kali-data
      - /var/run/docker.sock:/var/run/docker.sock
      - ./backend/.env:/srv/data/.env
      - ./config.toml:/srv/data/config.toml:ro
    depends_on:
      redis:
        condition: service_started
      mongodb:
        condition: service_started
      kali:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_BACKEND_URI: ${NEXT_PUBLIC_BACKEND_URI:-http://localhost:8080}
        NEXT_PUBLIC_DEPLOYMENT: ${NEXT_PUBLIC_DEPLOYMENT:-LOCAL}
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env
    depends_on:
      - backend
    restart: unless-stopped

  kali:
    build: ./kali
    container_name: kali
    privileged: true
    ports:
      - "4242:22"
      - "4200:4200"
      - "1194:1194/udp"
      - "9020:9020"
      - "5901:5901"
    volumes:
      - ./kali-data:/kali-data
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/22'"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  mongodb-data:
    driver: local
  redis-data:
    driver: local
  kali-data:
    driver: local
