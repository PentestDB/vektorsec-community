services:
  mongodb:
    image: mongo:latest
    volumes:
      - mongodb-data:/data/db
    ports:
      - "27017:27017"
    restart: always

  redis:
    image: redis:latest
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    restart: always

  backend:
    build: ./backend
    environment:
      MONGO_URI: mongodb://mongodb:27017/vektorsec
      REDIS_URL: redis://redis:6379
      CODEX_HOME: /root/.codex
      SSH_CONFIG_FILE: /root/.ssh/config
      # "Local" work hosts execute in the backend runtime. Keep their folders
      # on the persistent backend-data volume across rebuilds/restarts.
      WORKSPACE_DIR: /srv/data/workspaces
    cap_add:
      # Required only when a workspace selects Local and starts OpenVPN there.
      - NET_ADMIN
    ports:
      - "8081:8081"
      - "6080:6080"
    volumes:
      - ./kali-data:/kali-data
      - /var/run/docker.sock:/var/run/docker.sock
      - backend-data:/srv/data
      - ./backend/.env:/srv/data/.env
      - ./backend/model-registry.json:/srv/data/model-registry.json
      - ./config.toml:/srv/data/config.toml:ro
      - ${CODEX_AUTH_FILE:-${HOME}/.codex/auth.json}:/root/.codex/auth.json
      - ${HOST_SSH_DIR:-${HOME}/.ssh}:/root/.ssh:ro
      - ${HOST_SSH_KEYS_DIR:-${HOME}/keys}:/root/keys:ro
    depends_on:
      redis:
        condition: service_started
      mongodb:
        condition: service_started
      kali:
        condition: service_healthy
    healthcheck:
      # Readiness endpoint (Mongo + Redis). Node 22 ships global fetch, so the
      # image needs no extra tooling for this probe.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8081/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    environment:
      PORT: 3001
      # Black-box gateway targets (server-side only — never reach the browser)
      BACKEND_URI: http://backend:8081
      VNC_ORIGIN_URI: http://backend:6080
    ports:
      - "3001:3001"
    env_file:
      - ./frontend/.env
    depends_on:
      - backend
    restart: unless-stopped

  kali:
    build: ./kali
    container_name: kali
    privileged: true
    ports:
      - "4242:22"
      - "4200:4200"
      - "1194:1194/udp"
      - "9020:9020"
      - "5901:5901"
    volumes:
      - ./kali-data:/kali-data
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/22'"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  mongodb-data:
    driver: local
  redis-data:
    driver: local
  kali-data:
    driver: local
  backend-data:
    driver: local
