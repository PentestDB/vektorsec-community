<svg xmlns="http://www.w3.org/2000/svg" width="150" height="190" viewBox="15 5 150 190">
  <defs>
    <!-- Neon Cyan Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#4FACFE"/>
    </linearGradient>

    <!-- Purple Neon Gradient -->
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E100FF"/>
      <stop offset="100%" stop-color="#7F00FF"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- VektorSec shield icon (extracted from logo/gemini-svg.svg, no background) -->
  <g>
    <!-- Outer Cyber Shield Outline -->
    <path d="M 90 20 L 150 45 L 150 105 C 150 145 110 170 90 180 C 70 170 30 145 30 105 L 30 45 Z"
          fill="none" stroke="url(#purpleGrad)" stroke-width="3" opacity="0.4"/>
    <!-- Left Wing (V Vector) -->
    <path d="M 42 50 L 90 148 L 72 148 L 30 62 Z" fill="url(#purpleGrad)" filter="url(#glow)"/>
    <!-- Right Wing (V Vector) -->
    <path d="M 138 50 L 90 148 L 108 148 L 150 62 Z" fill="url(#cyanGrad)" filter="url(#glow)"/>
    <!-- Center AI Copilot Diamond / Core -->
    <polygon points="90,40 105,70 90,100 75,70" fill="url(#cyanGrad)" filter="url(#glow)"/>
    <circle cx="90" cy="70" r="4" fill="#ffffff" filter="url(#glow)"/>
    <!-- Terminal Tech Accent Line -->
    <line x1="90" y1="105" x2="90" y2="140" stroke="#00F2FE" stroke-width="2" stroke-dasharray="3 3"/>
  </g>
</svg>
