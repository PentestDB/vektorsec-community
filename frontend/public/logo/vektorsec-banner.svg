<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Neon Cyan Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#4FACFE"/>
    </linearGradient>

    <!-- Purple Neon Gradient -->
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E100FF"/>
      <stop offset="100%" stop-color="#7F00FF"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" rx="16"/>

  <!-- LOGO ICON (Vektor Shield + AI Core) -->
  <g transform="translate(60, 35)">
    <!-- Outer Cyber Shield Outer Lines -->
    <path d="M 90 20 L 150 45 L 150 105 C 150 145 110 170 90 180 C 70 170 30 145 30 105 L 30 45 Z" 
          fill="none" stroke="url(#purpleGrad)" stroke-width="3" opacity="0.4"/>

    <!-- Left Wing (V Vector) -->
    <path d="M 42 50 L 90 148 L 72 148 L 30 62 Z" fill="url(#purpleGrad)" filter="url(#glow)"/>

    <!-- Right Wing (V Vector) -->
    <path d="M 138 50 L 90 148 L 108 148 L 150 62 Z" fill="url(#cyanGrad)" filter="url(#glow)"/>

    <!-- Center AI Copilot Diamond / Core -->
    <polygon points="90,40 105,70 90,100 75,70" fill="url(#cyanGrad)" filter="url(#glow)"/>
    <circle cx="90" cy="70" r="4" fill="#ffffff" filter="url(#glow)"/>

    <!-- Terminal Tech Accent Lines -->
    <line x1="90" y1="105" x2="90" y2="140" stroke="#00F2FE" stroke-width="2" stroke-dasharray="3 3"/>
  </g>

  <!-- BRAND TEXT -->
  <g transform="translate(260, 115)">
    <!-- VEKTORSEC -->
    <text x="0" y="10" font-family="'Inter', 'Space Grotesk', 'Segoe UI', sans-serif" font-weight="900" font-size="52" letter-spacing="2" fill="#ffffff">
      VEKTOR<tspan fill="url(#cyanGrad)">SEC</tspan>
    </text>
    
    <!-- SUBTITLE / TAGLINE -->
    <text x="0" y="42" font-family="'Fira Code', 'JetBrains Mono', monospace" font-weight="600" font-size="16" letter-spacing="4" fill="#718096">
      AUTONOMOUS AI PENTEST
    </text>

    <!-- BADGE -->
    <rect x="300" y="26" width="110" height="22" rx="4" fill="url(#purpleGrad)" opacity="0.8"/>
    <text x="355" y="41" font-family="'Fira Code', monospace" font-weight="700" font-size="11" fill="#ffffff" text-anchor="middle" letter-spacing="1">
      COPILOT
    </text>
  </g>
</svg>
